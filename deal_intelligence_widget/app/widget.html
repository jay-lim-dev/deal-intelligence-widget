<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deal Desk</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="widget-container">

    <!-- ── Tab Bar ──────────────────────────────────────────── -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn"        data-tab="messaging">Messaging</button>
    </nav>

    <!-- ── Overview Panel ──────────────────────────────────── -->
    <section class="tab-panel active" id="panel-overview">

      <!-- Loading state (visible until API responds) -->
      <div id="overview-spinner" class="spinner-wrap">
        <div class="spinner"></div>
        <p class="spinner-text">Loading deal data…</p>
      </div>

      <!-- Error state -->
      <div id="overview-error" class="overview-error hidden">
        <p>Could not load deal data. Close and reopen the widget to try again.</p>
      </div>

      <!-- Content (hidden until data arrives) -->
      <div id="overview-content" class="hidden">

        <p class="section-title">Deal Details</p>

        <div class="fields-grid">

          <div class="field-item field-span-2">
            <div class="field-label">Deal Name</div>
            <div class="field-value" id="field-deal-name"></div>
          </div>

          <div class="field-item">
            <div class="field-label">Deal Owner</div>
            <div class="field-value" id="field-deal-owner"></div>
          </div>

          <div class="field-item">
            <div class="field-label">Total (Selected Debts)</div>
            <div class="field-value" id="field-total"></div>
          </div>

          <div class="field-item">
            <div class="field-label">Monthly Payment</div>
            <div class="field-value" id="field-monthly-payment"></div>
          </div>

          <div class="field-item">
            <div class="field-label">Total Program Savings</div>
            <div class="field-value" id="field-total-savings"></div>
          </div>

        </div>

        <p class="section-title">Stage History</p>

        <div id="stage-timeline" class="v-timeline">
          <p class="timeline-placeholder">Loading…</p>
        </div>

      </div><!-- /#overview-content -->

    </section>

    <!-- ── Messaging Panel ──────────────────────────────────── -->
    <section class="tab-panel" id="panel-messaging">
      <div class="chat-layout">

        <!-- Recipient header -->
        <div class="chat-header">
          <div class="form-group">
            <label class="form-label">To</label>
            <input type="text" class="form-input" id="to-number" readonly value="Loading…">
          </div>
          <div class="chat-header-row">
            <div class="provider-toggle">
              <button class="provider-btn active" data-provider="smsmagic">SMS Magic</button>
              <button class="provider-btn"        data-provider="twilio">Twilio</button>
            </div>
            <button class="btn-refresh" id="btn-refresh" title="Refresh messages">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Chat history window -->
        <div class="chat-window" id="chat-window">
          <div id="chat-loading" class="chat-spinner">
            <div class="spinner"></div>
            <p class="spinner-text">Loading messages…</p>
          </div>
          <div id="chat-messages" class="chat-messages hidden"></div>
        </div>

        <!-- Compose bar -->
        <div class="chat-compose">
          <div id="status-msg" class="status-msg"></div>
          <textarea
            class="form-input"
            id="sms-body"
            placeholder="Type your message here…"
            maxlength="160"
          ></textarea>
          <div class="compose-footer">
            <span class="char-count" id="char-count">0 / 160</span>
            <div class="compose-actions">
              <button class="btn btn-secondary" id="btn-clear">Clear</button>
              <button class="btn btn-primary"   id="btn-send" disabled>Send SMS</button>
            </div>
          </div>
        </div>

      </div>
    </section>

  </div><!-- /.widget-container -->

  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
